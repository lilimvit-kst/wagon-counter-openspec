schema: spec-driven
context: 'Проект wagon-counter по docs/source/wagon_counter_software_spec_v1_0.md.

  Пользовательские уточнения приоритетны. Читать AGENTS.md, docs/OPENSPEC_RULES.md, docs/blocks.json и architecture.md.

  Одна точка, две камеры1920x1080/30: сверху count-top и около15градусов fill-angle; отсчет угла неизвестен.

  Обычный x86 CPU без обязательного Jetson/GPU. Python3.12, FastAPI/Pydantic2, SQLite WAL Edge,

  PostgreSQL17 центр, MQTT5 QoS1, MediaMTX, YOLO26n/OpenVINO CPU/ByteTrack, React19/TS/Vite7/Node24.

  Только Edge меняет счет. Один writer; атомарный checkpoint/crossing/event/projection/outbox;

  центр подтверждает непрерывный journal sequence после commit, PUBACK недостаточен.

  Четыре типа: bag_25,bag_50,bundle_5kg,bundle_10kg; пачка=одно место; unknown не пятый класс модели.

  Номер вагона строка8 ASCII-цифр, UUID сессии до номера. Возвраты/дедупликация/аудит обязательны.

  План, видимая занятость и объем раздельны; неизвестные масса/объем=null.

  Все B00–B14 пока planned. Строгий порядок; отчеты и доказательства в docs/blocks.json.

  Русские документы, английские имена кода/API и обязательные заголовки OpenSpec.

  Не выдумывать железо, RTSP, ROI, ERP и приемку. Simulator/replay/shadow отделены от live; ERP в них выключена.

  '
rules:
  proposal:
  - Указать блок, раздел ТЗ, зависимости, наблюдаемый результат и затрагиваемые модули.
  - Capabilities должны соответствовать точным путям; сначала проверить main specs и активные changes.
  specs:
  - Сохранять Requirement/Scenario, SHALL/MUST, WHEN/THEN и устойчивые WC-Bxx-Rnn-Snn.
  - Для новой capability добавить Purpose; MODIFIED содержит полное обновленное требование и сохраненные сценарии.
  - Согласовать единицы, время, версии и ключи с общими DTO; описывать наблюдаемое поведение, а не внутренние
    классы.
  design:
  - Описать владельца записи, входы/выходы, транзакцию, повторы, конфликты и восстановление для затронутых
    данных.
  - Сохранять чистый domain, общие DTO и генерацию TS. Обосновать новые зависимости конкретным ограничением.
  - Указать миграцию/откат, среду проверки и границы принятых режимов. Цели FPS/точности не выдавать за измерения.
  tasks:
  - 'Каждая задача: - [ ] X.Y действие, результат и способ его проверки.'
  - 'Порядок: контракты, реализация, интеграция, релевантные тесты, отчет.'
  - Связать Scenario с тестом/протоколом; не отмечать заглушки и плановые команды как успешно выполненные.
operations:
  apply:
    guidance:
    - Перед кодом выполнить python3 scripts/check_project.py --can-start Bxx и прочитать отчет зависимостей.
    - Продолжать уже порученную работу без повторного согласования рутинных действий; реальные блокеры записывать.
    - Отмечать задачи только после проверки; planning complete не означает готовое приложение.
  archive:
    guidance:
    - Архивировать после реализации, отчета, verification и завершенных задач.
    - Синхронизировать только delta specs данного change; после архива выполнить npm run check.
